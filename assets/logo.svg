<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="斓世 Irosekai">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.25" stop-color="#22d9e8"/>
      <stop offset="0.5" stop-color="#b6ff5c"/>
      <stop offset="0.75" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff3d9a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="60" fill="#05060b"/>
  <circle cx="128" cy="128" r="92" fill="url(#glow)"/>
  <circle cx="128" cy="128" r="70" fill="none" stroke="url(#ring)" stroke-width="7" opacity="0.45" filter="url(#soft)"/>
  <circle cx="128" cy="128" r="70" fill="none" stroke="url(#ring)" stroke-width="20"/>
  <circle cx="128" cy="128" r="26" fill="url(#ring)"/>
</svg>
